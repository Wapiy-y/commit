name: Backend Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Static checks for the Netlify Functions backend. `node --check` parses
      # without executing, so no DATABASE_URL / ENCRYPTION_KEY / NEON_AUTH_URL
      # secrets are needed here.
      - name: Check and lint backend
        run: npm run check:backend
